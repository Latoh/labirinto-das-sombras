<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 Erros do Minecraft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root{
    --sky:#8fd1ea;
    --sky-2:#bfe8f5;
    --grass:#6aa84f;
    --grass-dark:#4a7a35;
    --dirt:#8b5a2b;
    --dirt-dark:#5e3c1c;
    --slot:#c6c6c6;
    --slot-dark:#8b8b8b;
    --slot-light:#e4e4e4;
    --panel:#c6c6c6;
    --ink:#2b2b1e;
    --diamond:#4ad9d9;
    --gold:#f4c430;
    --redstone:#c53a2a;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      linear-gradient(var(--sky) 0%, var(--sky-2) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'VT323', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:16px;
    padding-block:28px;
  }

  .wrap{ width:100%; max-width:760px; }

  .panel{
    background:var(--panel);
    border:4px solid #3a3a3a;
    box-shadow:
      inset 3px 3px 0 var(--slot-light),
      inset -3px -3px 0 var(--slot-dark),
      0 10px 0 rgba(0,0,0,0.25);
    padding:18px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  header{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  h1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(14px, 4.2vw, 20px);
    line-height:1.7;
    margin:0;
    color:var(--grass-dark);
    text-shadow:2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,0.25);
    text-wrap:balance;
  }
  .subtitle{ margin:0; font-size:18px; color:#4a4a3a; }

  .stats{
    display:flex;
    justify-content:space-between;
    gap:8px;
    background:#8b8b8b;
    border:3px solid #3a3a3a;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.25);
    padding:8px 12px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; flex:1; gap:2px; }
  .stat-label{ font-family:'Press Start 2P', monospace; font-size:8px; color:#2b2b1e; }
  .stat-value{ font-size:22px; font-variant-numeric:tabular-nums; color:#1c1c14; font-weight:700; }

  .scenes{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  @media (min-width:640px){
    .scenes{ flex-direction:row; }
  }

  .scene-frame{
    position:relative;
    flex:1;
    min-width:0;
    background:#dcdccb;
    border:4px solid #3a3a3a;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.5), inset -2px -2px 0 rgba(0,0,0,0.25);
    line-height:0;
  }
  .scene-frame svg{ display:block; width:100%; height:auto; }

  .hit{
    position:absolute;
    border:none;
    background:transparent;
    cursor:crosshair;
    padding:0;
  }
  .hit.found{ cursor:default; }

  .marker{
    position:absolute;
    width:13%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:3px solid var(--diamond);
    box-shadow:0 0 0 2px rgba(0,0,0,0.5);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .marker.wrong{ border-color:var(--redstone); animation:fadeOut 0.5s ease forwards; }
  @keyframes fadeOut{ to{ opacity:0; } }

  .btn{
    align-self:center;
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    color:#f4f4e4;
    background:var(--grass-dark);
    border:3px solid #2e4a20;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.3), 0 4px 0 #263f1a;
    padding:12px 20px;
    cursor:pointer;
  }
  .btn:active{ transform:translateY(3px); box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.3); }
  .btn:focus-visible{ outline:3px solid var(--diamond); outline-offset:2px; }

  .win-overlay{
    position:fixed; inset:0; background:rgba(10,10,6,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .win-card{
    background:var(--panel); border:4px solid #3a3a3a;
    box-shadow:inset 3px 3px 0 var(--slot-light), inset -3px -3px 0 var(--slot-dark);
    padding:24px 22px; text-align:center; max-width:300px;
    display:flex; flex-direction:column; gap:14px;
  }
  .win-title{ font-family:'Press Start 2P', monospace; font-size:13px; color:var(--grass-dark); margin:0; line-height:1.6; }
  .win-stats{ display:flex; justify-content:center; gap:20px; }
  .win-stats div{ display:flex; flex-direction:column; gap:2px; }
  .win-stats span{ font-family:'Press Start 2P', monospace; font-size:7px; color:#4a4a3a; }
  .win-stats strong{ font-size:22px; color:#1c1c14; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>


<div class="wrap">
  <div class="panel">
    <header>
      <h1>7 Erros<br>do Minecraft</h1>
      <p class="subtitle">Toque nos pontos onde as duas cenas são diferentes.</p>
    </header>

    <div class="stats" role="status" aria-live="polite">
      <div class="stat">
        <span class="stat-label">TEMPO</span>
        <span class="stat-value" id="statTime">00:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">ACHADOS</span>
        <span class="stat-value" id="statFound">0/7</span>
      </div>
    </div>

    <div class="scenes">
      <div class="scene-frame" id="frameA"></div>
      <div class="scene-frame" id="frameB"></div>
    </div>

    <button class="btn" id="newGame" type="button">Novo Jogo</button>
  </div>
</div>

<div class="win-overlay" id="winOverlay" hidden>
  <div class="win-card">
    <p class="win-title">ACHOU OS<br>7 ERROS!</p>
    <div class="win-stats">
      <div><span>TEMPO</span><strong id="winTime">00:00</strong></div>
    </div>
    <button class="btn" id="winRestart" type="button">Jogar De Novo</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var VB_W = 400, VB_H = 260;
  var ROUND_COUNT = 7;

  var DIFFS = [
    { id: 'sun_color', box: [300, 5, 80, 80] },
    { id: 'cloud1_visible', box: [15, 15, 90, 60] },
    { id: 'cloud2_move', box: [150, 5, 130, 60] },
    { id: 'leaf_extra_visible', box: [70, 120, 55, 60] },
    { id: 'roof_color', box: [250, 95, 90, 60] },
    { id: 'door_color', box: [278, 170, 34, 40] },
    { id: 'window_visible', box: [310, 152, 36, 34] },
    { id: 'chimney_smoke_visible', box: [312, 95, 44, 50] },
    { id: 'mob_color', box: [142, 192, 42, 42] },
    { id: 'mob_eye3_visible', box: [142, 192, 42, 42] },
    { id: 'animal_color', box: [188, 214, 44, 32] },
    { id: 'flower_move', box: [95, 210, 55, 32] },
    { id: 'chest_latch_visible', box: [22, 200, 46, 40] },
    { id: 'torch_flame_color', box: [372, 160, 28, 44] }
  ];

  var frameA = document.getElementById('frameA');
  var frameB = document.getElementById('frameB');
  var statTime = document.getElementById('statTime');
  var statFound = document.getElementById('statFound');
  var winOverlay = document.getElementById('winOverlay');
  var winTime = document.getElementById('winTime');

  var game = { seed: 0, active: [], found: {}, startTime: null, elapsed: 0, finished: false };

  function mulberry32(a) {
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function sceneSVG(activeSet) {
    var on = function(id) { return activeSet.has(id); };
    var sunFill = on('sun_color') ? '#f2994a' : '#ffd43b';
    var cloud1Op = on('cloud1_visible') ? 0 : 1;
    var cloud2X = on('cloud2_move') ? 40 : 0;
    var leafExtraOp = on('leaf_extra_visible') ? 0 : 1;
    var roofFill = on('roof_color') ? '#3d6fa8' : '#8b3a2a';
    var doorFill = on('door_color') ? '#a83a2a' : '#5c3a1e';
    var windowFill = on('window_visible') ? '#c8a165' : '#bfe8f5';
    var smokeOp = on('chimney_smoke_visible') ? 0.85 : 0;
    var mobFill = on('mob_color') ? '#2f9e8f' : '#5aa84a';
    var eye3Op = on('mob_eye3_visible') ? 1 : 0;
    var animalFill = on('animal_color') ? '#b06ad4' : '#f2a0c4';
    var flowerX = on('flower_move') ? -22 : 0;
    var latchFill = on('chest_latch_visible') ? '#e8c14a' : '#6b4420';
    var flameFill = on('torch_flame_color') ? '#4ad9d9' : '#f2994a';

    return (
      '<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="' + VB_W + '" height="' + VB_H + '" fill="#8fd1ea"/>' +
      '<circle cx="340" cy="45" r="24" fill="' + sunFill + '"/>' +
      '<g opacity="' + cloud1Op + '" fill="#ffffff">' +
        '<ellipse cx="55" cy="42" rx="22" ry="13"/><ellipse cx="75" cy="36" rx="16" ry="11"/><ellipse cx="35" cy="38" rx="14" ry="10"/>' +
      '</g>' +
      '<g transform="translate(' + cloud2X + ',0)" fill="#ffffff">' +
        '<ellipse cx="190" cy="30" rx="24" ry="13"/><ellipse cx="212" cy="26" rx="16" ry="10"/><ellipse cx="170" cy="28" rx="14" ry="9"/>' +
      '</g>' +
      '<rect x="0" y="190" width="' + VB_W + '" height="14" fill="#6aa84f"/>' +
      '<rect x="0" y="204" width="' + VB_W + '" height="56" fill="#8b5a2b"/>' +
      '<rect x="64" y="150" width="14" height="54" fill="#6b4420"/>' +
      '<circle cx="71" cy="140" r="30" fill="#4a8f3c"/>' +
      '<circle cx="95" cy="155" r="18" fill="#5aa84a" opacity="' + leafExtraOp + '"/>' +
      '<rect x="250" y="150" width="90" height="54" fill="#c8a165"/>' +
      '<polygon points="245,150 295,110 345,150" fill="' + roofFill + '"/>' +
      '<rect x="278" y="178" width="20" height="26" fill="' + doorFill + '"/>' +
      '<rect x="316" y="160" width="18" height="18" fill="' + windowFill + '" stroke="#5c3a1e" stroke-width="2"/>' +
      '<rect x="330" y="122" width="12" height="30" fill="#8b8b8b"/>' +
      '<g opacity="' + smokeOp + '" fill="#e4e4e4">' +
        '<circle cx="336" cy="108" r="7"/><circle cx="341" cy="96" r="9"/><circle cx="333" cy="88" r="6"/>' +
      '</g>' +
      '<rect x="150" y="202" width="26" height="26" fill="' + mobFill + '"/>' +
      '<rect x="156" y="210" width="5" height="5" fill="#1c1c14"/>' +
      '<rect x="168" y="210" width="5" height="5" fill="#1c1c14"/>' +
      '<rect x="162" y="218" width="5" height="5" fill="#1c1c14" opacity="' + eye3Op + '"/>' +
      '<g>' +
        '<rect x="196" y="222" width="6" height="8" fill="#8b5a6a"/><rect x="216" y="222" width="6" height="8" fill="#8b5a6a"/>' +
        '<ellipse cx="210" cy="230" rx="18" ry="11" fill="' + animalFill + '"/>' +
        '<circle cx="224" cy="228" r="5" fill="' + animalFill + '"/>' +
      '</g>' +
      '<g transform="translate(' + flowerX + ',0)">' +
        '<rect x="129" y="224" width="3" height="14" fill="#4a8f3c"/>' +
        '<circle cx="130" cy="220" r="3" fill="#f4f4e4"/><circle cx="126" cy="223" r="3" fill="#f4f4e4"/>' +
        '<circle cx="134" cy="223" r="3" fill="#f4f4e4"/><circle cx="130" cy="226" r="3" fill="#f4f4e4"/>' +
        '<circle cx="130" cy="223" r="2.4" fill="#f4c430"/>' +
      '</g>' +
      '<rect x="28" y="214" width="32" height="22" fill="#8b5a2b" stroke="#3a3a3a" stroke-width="1.5"/>' +
      '<rect x="28" y="206" width="32" height="11" fill="#6b4420" stroke="#3a3a3a" stroke-width="1.5"/>' +
      '<rect x="42" y="216" width="5" height="7" fill="' + latchFill + '"/>' +
      '<rect x="386" y="188" width="4" height="22" fill="#6b4420"/>' +
      '<path d="M388 188 C 383 182, 383 176, 388 170 C 393 176, 393 182, 388 188 Z" fill="' + flameFill + '"/>' +
      '</svg>'
    );
  }

  function pctBox(box) {
    return {
      left: (box[0] / VB_W * 100) + '%',
      top: (box[1] / VB_H * 100) + '%',
      width: (box[2] / VB_W * 100) + '%',
      height: (box[3] / VB_H * 100) + '%'
    };
  }

  function buildFrame(container, activeSet) {
    container.innerHTML = sceneSVG(activeSet);
    game.active.forEach(function(id) {
      var d = DIFFS.filter(function(x) { return x.id === id; })[0];
      var p = pctBox(d.box);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hit';
      btn.style.left = p.left; btn.style.top = p.top;
      btn.style.width = p.width; btn.style.height = p.height;
      btn.dataset.diff = id;
      btn.setAttribute('aria-label', 'Marcar diferenca');
      if (game.found[id]) btn.classList.add('found');
      btn.addEventListener('click', function(e) { onHitClick(id, container, e); });
      container.appendChild(btn);
    });
    container.addEventListener('click', onMissClick);
  }

  function onMissClick(e) {
    if (game.finished) return;
    if (e.target.classList.contains('hit')) return;
    var rect = e.currentTarget.getBoundingClientRect();
    var mx = ((e.clientX - rect.left) / rect.width) * 100;
    var my = ((e.clientY - rect.top) / rect.height) * 100;
    var marker = document.createElement('div');
    marker.className = 'marker wrong';
    marker.style.left = mx + '%'; marker.style.top = my + '%';
    e.currentTarget.appendChild(marker);
    setTimeout(function() { marker.remove(); }, 500);
  }

  function markFound(id) {
    game.found[id] = true;
    [frameA, frameB].forEach(function(frame) {
      var btn = frame.querySelector('.hit[data-diff="' + id + '"]');
      if (!btn) return;
      btn.classList.add('found');
      var marker = document.createElement('div');
      marker.className = 'marker';
      marker.style.left = '50%'; marker.style.top = '50%';
      btn.appendChild(marker);
    });
  }

  function onHitClick(id, container, e) {
    e.stopPropagation();
    if (game.finished || game.found[id]) return;
    if (!game.startTime) game.startTime = performance.now() - game.elapsed;
    markFound(id);
    updateStats();
    if (Object.keys(game.found).length === ROUND_COUNT) onWin();
  }

  function updateStats() {
    statFound.textContent = Object.keys(game.found).length + '/' + ROUND_COUNT;
  }

  function fmtTime(ms) {
    var s = Math.floor(Math.max(0, ms) / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function onWin() {
    game.finished = true;
    winTime.textContent = fmtTime(game.elapsed);
    winOverlay.hidden = false;
  }

  function startNewGame() {
    var seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    initGame(seed);
  }

  function initGame(seed) {
    game.seed = seed;
    var rng = mulberry32(seed);
    game.active = shuffle(DIFFS.map(function(d) { return d.id; }), rng).slice(0, ROUND_COUNT);
    game.found = {};
    game.startTime = null;
    game.elapsed = 0;
    game.finished = false;
    winOverlay.hidden = true;
    var activeSetA = new Set();
    var activeSetB = new Set(game.active);
    buildFrame(frameA, activeSetA);
    buildFrame(frameB, activeSetB);
    updateStats();
    statTime.textContent = fmtTime(0);
  }

  function frame() {
    if (game.startTime && !game.finished) {
      game.elapsed = performance.now() - game.startTime;
      statTime.textContent = fmtTime(game.elapsed);
    }
    requestAnimationFrame(frame);
  }

  document.getElementById('newGame').addEventListener('click', startNewGame);
  document.getElementById('winRestart').addEventListener('click', startNewGame);

  startNewGame();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
