<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queda de Blocos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root{
    --sky:#8fd1ea;
    --sky-2:#bfe8f5;
    --grass:#6aa84f;
    --grass-dark:#4a7a35;
    --slot:#c6c6c6;
    --slot-dark:#8b8b8b;
    --slot-light:#e4e4e4;
    --panel:#c6c6c6;
    --ink:#2b2b1e;
    --diamond:#4ad9d9;
    --gold:#f4c430;
    --redstone:#c53a2a;
    --board-bg:#221e2c;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      linear-gradient(var(--sky) 0%, var(--sky-2) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'VT323', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:16px;
    padding-block:28px;
  }

  .wrap{ width:100%; max-width:640px; }

  .panel{
    background:var(--panel);
    border:4px solid #3a3a3a;
    box-shadow:
      inset 3px 3px 0 var(--slot-light),
      inset -3px -3px 0 var(--slot-dark),
      0 10px 0 rgba(0,0,0,0.25);
    padding:18px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .top-row{ display:flex; justify-content:space-between; gap:8px; }
  .menu-link, .reset-link{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    color:#4a4a3a;
    text-decoration:none;
    background:var(--slot-light);
    border:2px solid #3a3a3a;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 var(--slot-dark);
    padding:6px 10px;
    cursor:pointer;
  }
  .menu-link:hover, .reset-link:hover{ color:var(--grass-dark); }

  header{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  h1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(14px, 4.6vw, 20px);
    line-height:1.6;
    margin:0;
    color:var(--grass-dark);
    text-shadow:2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,0.25);
    text-wrap:balance;
  }
  .subtitle{ margin:0; font-size:16px; color:#4a4a3a; }

  .stats{
    display:flex;
    justify-content:space-between;
    gap:6px;
    background:#8b8b8b;
    border:3px solid #3a3a3a;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.25);
    padding:8px 10px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; flex:1; gap:2px; }
  .stat-label{ font-family:'Press Start 2P', monospace; font-size:7px; color:#2b2b1e; }
  .stat-value{ font-size:19px; font-variant-numeric:tabular-nums; color:#1c1c14; font-weight:700; }

  .play-area{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .board-frame{
    background:var(--board-bg);
    border:4px solid #3a3a3a;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.15), inset -2px -2px 0 rgba(0,0,0,0.4);
    line-height:0;
    touch-action:none;
    flex:0 1 260px;
    max-width:260px;
    min-width:180px;
    aspect-ratio:10/18;
    cursor:pointer;
  }
  canvas#board{ display:block; width:100%; height:100%; }
  canvas#next{ display:block; background:var(--board-bg); }

  .side{ display:flex; flex-direction:column; gap:10px; align-items:center; }
  .next-frame{
    background:var(--board-bg);
    border:4px solid #3a3a3a;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.15), inset -2px -2px 0 rgba(0,0,0,0.4);
    padding:6px;
    line-height:0;
  }
  .next-label{ font-family:'Press Start 2P', monospace; font-size:8px; color:#4a4a3a; text-align:center; }

  .pad{
    display:grid;
    grid-template-columns:repeat(3, 46px);
    grid-template-rows:repeat(2, 46px);
    gap:6px;
  }
  .pad-btn{
    background:linear-gradient(180deg, var(--slot-light), var(--slot));
    border:2px solid #3a3a3a;
    box-shadow:inset 1px 1px 0 #fff, inset -2px -2px 0 var(--slot-dark);
    color:#2b2b1e;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  .pad-btn:active{ transform:translateY(2px); box-shadow:none; }
  .pad-rotate{ grid-column:2; grid-row:1; }
  .pad-left{ grid-column:1; grid-row:2; }
  .pad-down{ grid-column:2; grid-row:2; }
  .pad-right{ grid-column:3; grid-row:2; }

  .hint{ margin:0; font-size:13px; color:#4a4a3a; text-align:center; }
  .key{
    font-family:'VT323', monospace;
    background:rgba(0,0,0,0.12);
    border:1px solid #8b8b8b;
    border-radius:3px;
    padding:0 5px;
  }

  .game-overlay{
    position:fixed; inset:0; background:rgba(10,10,6,0.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .game-card{
    background:var(--panel); border:4px solid #3a3a3a;
    box-shadow:inset 3px 3px 0 var(--slot-light), inset -3px -3px 0 var(--slot-dark);
    padding:24px 22px; text-align:center; max-width:300px;
    display:flex; flex-direction:column; gap:14px;
  }
  .game-title{ font-family:'Press Start 2P', monospace; font-size:14px; color:var(--redstone); margin:0; }
  .game-stats{ display:flex; justify-content:center; gap:20px; }
  .game-stats div{ display:flex; flex-direction:column; gap:2px; }
  .game-stats span{ font-family:'Press Start 2P', monospace; font-size:7px; color:#4a4a3a; }
  .game-stats strong{ font-size:22px; color:#1c1c14; }

  .btn{
    align-self:center;
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    color:#f4f4e4;
    background:var(--grass-dark);
    border:3px solid #2e4a20;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.3), 0 4px 0 #263f1a;
    padding:12px 20px;
    cursor:pointer;
  }
  .btn:active{ transform:translateY(3px); box-shadow:inset 2px 2px 0 rgba(255,255,255,0.25), inset -2px -2px 0 rgba(0,0,0,0.3); }
  .btn:focus-visible{ outline:3px solid var(--diamond); outline-offset:2px; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>


<div class="wrap">
  <div class="panel">
    <div class="top-row">
      <a class="menu-link" href="../">← MENU</a>
      <button class="reset-link" id="resetBtn" type="button">↺ NOVO JOGO</button>
    </div>
    <header>
      <h1>Queda de<br>Blocos</h1>
      <p class="subtitle">Encaixe os blocos e complete fileiras!</p>
    </header>

    <div class="stats" role="status" aria-live="polite">
      <div class="stat"><span class="stat-label">PONTOS</span><span class="stat-value" id="statScore">0</span></div>
      <div class="stat"><span class="stat-label">NÍVEL</span><span class="stat-value" id="statLevel">1</span></div>
      <div class="stat"><span class="stat-label">LINHAS</span><span class="stat-value" id="statLines">0</span></div>
      <div class="stat"><span class="stat-label">RECORDE</span><span class="stat-value" id="statBest">0</span></div>
    </div>

    <div class="play-area">
      <div class="board-frame"><canvas id="board"></canvas></div>
      <div class="side">
        <div>
          <p class="next-label">PRÓXIMO</p>
          <div class="next-frame"><canvas id="next" width="88" height="88"></canvas></div>
        </div>
        <div class="pad">
          <button class="pad-btn pad-rotate" id="btnRotate" type="button" aria-label="Girar">⟳</button>
          <button class="pad-btn pad-left" id="btnLeft" type="button" aria-label="Esquerda">◀</button>
          <button class="pad-btn pad-down" id="btnDown" type="button" aria-label="Descer">▼</button>
          <button class="pad-btn pad-right" id="btnRight" type="button" aria-label="Direita">▶</button>
        </div>
      </div>
    </div>

    <p class="hint"><span class="key">← →</span> mover · <span class="key">↑</span> girar · <span class="key">↓</span> descer · <span class="key">ESPAÇO</span> soltar</p>
    <p class="hint">No tabuleiro: toque na esquerda/direita pra mover, no meio pra girar</p>
  </div>
</div>

<div class="game-overlay" id="gameOverlay" hidden>
  <div class="game-card">
    <p class="game-title">FIM DE JOGO</p>
    <div class="game-stats">
      <div><span>PONTOS</span><strong id="finalScore">0</strong></div>
      <div><span>RECORDE</span><strong id="finalBest">0</strong></div>
    </div>
    <button class="btn" id="restartBtn" type="button">Jogar De Novo</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var COLS = 10, ROWS = 18, CELL = 30;
  var BEST_KEY = 'queda-de-blocos-best-v1';

  var BLOCKS = {
    ice:      { fill:'#8fd6e8', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#b8e6f0"/><path d="M'+(s*0.2)+' '+(s*0.2)+' L '+(s*0.5)+' '+(s*0.5)+' L '+(s*0.3)+' '+(s*0.8)+' M '+(s*0.5)+' '+(s*0.5)+' L '+(s*0.8)+' '+(s*0.3)+'" stroke="#ffffff" stroke-width="'+(s*0.06)+'" fill="none"/>'; } },
    gold:     { fill:'#f4c430', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#c99a1e"/><rect x="'+(s*0.15)+'" y="'+(s*0.15)+'" width="'+(s*0.7)+'" height="'+(s*0.7)+'" fill="#f4c430"/>'; } },
    amethyst: { fill:'#9c6ad4', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#5a3a8f"/><polygon points="'+(s*0.5)+',' +(s*0.15)+' '+(s*0.75)+',' +(s*0.85)+' '+(s*0.25)+',' +(s*0.85)+'" fill="#9c6ad4"/>'; } },
    grass:    { fill:'#6aa84f', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#6aa84f"/><rect width="'+s+'" height="'+(s*0.28)+'" fill="#8fcf6a"/>'; } },
    redstone: { fill:'#c53a2a', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#7a2a1e"/><circle cx="'+(s*0.5)+'" cy="'+(s*0.5)+'" r="'+(s*0.22)+'" fill="#c53a2a"/>'; } },
    lapis:    { fill:'#2a4a8f', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#2a4a8f"/><rect x="'+(s*0.2)+'" y="'+(s*0.2)+'" width="'+(s*0.14)+'" height="'+(s*0.14)+'" fill="#f4c430"/><rect x="'+(s*0.6)+'" y="'+(s*0.55)+'" width="'+(s*0.12)+'" height="'+(s*0.12)+'" fill="#f4c430"/>'; } },
    copper:   { fill:'#c26a3e', draw:function(s){ return '<rect width="'+s+'" height="'+s+'" fill="#c26a3e"/><circle cx="'+(s*0.3)+'" cy="'+(s*0.35)+'" r="'+(s*0.08)+'" fill="#5aa084"/><circle cx="'+(s*0.68)+'" cy="'+(s*0.62)+'" r="'+(s*0.09)+'" fill="#5aa084"/>'; } }
  };

  var SHAPES = {
    I: { skin:'ice', states:[
      [[1,0],[1,1],[1,2],[1,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,1],[1,1],[2,1],[3,1]]
    ]},
    O: { skin:'gold', states:[
      [[1,1],[1,2],[2,1],[2,2]],
      [[1,1],[1,2],[2,1],[2,2]],
      [[1,1],[1,2],[2,1],[2,2]],
      [[1,1],[1,2],[2,1],[2,2]]
    ]},
    T: { skin:'amethyst', states:[
      [[0,1],[1,0],[1,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,1]],
      [[1,0],[1,1],[1,2],[2,1]],
      [[0,1],[1,0],[1,1],[2,1]]
    ]},
    S: { skin:'grass', states:[
      [[0,1],[0,2],[1,0],[1,1]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[0,1],[0,2],[1,0],[1,1]],
      [[0,1],[1,1],[1,2],[2,2]]
    ]},
    Z: { skin:'redstone', states:[
      [[0,0],[0,1],[1,1],[1,2]],
      [[0,2],[1,1],[1,2],[2,1]],
      [[0,0],[0,1],[1,1],[1,2]],
      [[0,2],[1,1],[1,2],[2,1]]
    ]},
    J: { skin:'lapis', states:[
      [[0,0],[1,0],[1,1],[1,2]],
      [[0,1],[0,2],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,0],[2,1]]
    ]},
    L: { skin:'copper', states:[
      [[0,2],[1,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[1,2],[2,0]],
      [[0,0],[0,1],[1,1],[2,1]]
    ]}
  };
  var TYPES = Object.keys(SHAPES);

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
  var nextCanvas = document.getElementById('next');
  var nextCtx = nextCanvas.getContext('2d');

  var statScore = document.getElementById('statScore');
  var statLevel = document.getElementById('statLevel');
  var statLines = document.getElementById('statLines');
  var statBest = document.getElementById('statBest');
  var gameOverlay = document.getElementById('gameOverlay');
  var finalScore = document.getElementById('finalScore');
  var finalBest = document.getElementById('finalBest');

  var blockIconCache = {};
  function blockDataURL(type) {
    if (blockIconCache[type]) return blockIconCache[type];
    var s = 32;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'">' + BLOCKS[type].draw(s) + '</svg>';
    var img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(svg);
    blockIconCache[type] = img;
    return img;
  }
  TYPES.forEach(function(t) { blockDataURL(SHAPES[t].skin); });

  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}
  statBest.textContent = best;

  var game = {
    board: [],
    current: null,
    next: null,
    score: 0,
    lines: 0,
    level: 1,
    dropInterval: 700,
    lastDrop: 0,
    over: false,
    keysDown: new Set(),
    lastRepeat: 0
  };

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < ROWS; r++) b.push(new Array(COLS).fill(null));
    return b;
  }

  function randomType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function spawnPiece(type) {
    return { type: type, rot: 0, row: 0, col: 3, skin: SHAPES[type].skin };
  }

  function cellsFor(piece) {
    return SHAPES[piece.type].states[piece.rot].map(function(rc) {
      return { r: piece.row + rc[0], c: piece.col + rc[1] };
    });
  }

  function collides(piece) {
    var cells = cellsFor(piece);
    for (var i = 0; i < cells.length; i++) {
      var r = cells[i].r, c = cells[i].c;
      if (c < 0 || c >= COLS || r >= ROWS) return true;
      if (r >= 0 && game.board[r][c]) return true;
    }
    return false;
  }

  function tryMove(dr, dc) {
    if (game.over) return false;
    var moved = { type: game.current.type, rot: game.current.rot, row: game.current.row + dr, col: game.current.col + dc, skin: game.current.skin };
    if (collides(moved)) return false;
    game.current = moved;
    return true;
  }

  function tryRotate() {
    if (game.over) return;
    var newRot = (game.current.rot + 1) % 4;
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      var candidate = { type: game.current.type, rot: newRot, row: game.current.row, col: game.current.col + kicks[i], skin: game.current.skin };
      if (!collides(candidate)) { game.current = candidate; return; }
    }
  }

  function lockPiece() {
    var cells = cellsFor(game.current);
    cells.forEach(function(p) {
      if (p.r >= 0 && p.r < ROWS) game.board[p.r][p.c] = game.current.skin;
    });
    clearLines();
    game.current = game.next;
    game.next = spawnPiece(randomType());
    drawNext();
    if (collides(game.current)) {
      endGame();
    }
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (game.board[r].every(function(cell) { return cell !== null; })) {
        game.board.splice(r, 1);
        game.board.unshift(new Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      var points = [0, 100, 300, 500, 800][cleared] * game.level;
      game.score += points;
      game.lines += cleared;
      game.level = Math.floor(game.lines / 10) + 1;
      game.dropInterval = Math.max(100, 700 - (game.level - 1) * 60);
      statScore.textContent = game.score;
      statLines.textContent = game.lines;
      statLevel.textContent = game.level;
    }
  }

  function ghostRow() {
    var testRow = game.current.row;
    while (true) {
      var test = { type: game.current.type, rot: game.current.rot, row: testRow + 1, col: game.current.col, skin: game.current.skin };
      if (collides(test)) break;
      testRow++;
    }
    return testRow;
  }

  function drawCell(c, r, type, alpha) {
    var img = blockDataURL(type);
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, c * CELL, r * CELL, CELL, CELL);
    } else {
      ctx.fillStyle = BLOCKS[type].fill;
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(c * CELL + 0.5, r * CELL + 0.5, CELL - 1, CELL - 1);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#221e2c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (var c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,canvas.height); ctx.stroke(); }
    for (var r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(canvas.width,r*CELL); ctx.stroke(); }

    for (var rr = 0; rr < ROWS; rr++) {
      for (var cc = 0; cc < COLS; cc++) {
        if (game.board[rr][cc]) drawCell(cc, rr, game.board[rr][cc]);
      }
    }

    if (game.current && !game.over) {
      var gr = ghostRow();
      cellsFor({ type: game.current.type, rot: game.current.rot, row: gr, col: game.current.col }).forEach(function(p) {
        if (p.r >= 0) drawCell(p.c, p.r, game.current.skin, 0.28);
      });
      cellsFor(game.current).forEach(function(p) {
        if (p.r >= 0) drawCell(p.c, p.r, game.current.skin);
      });
    }
  }

  function drawNext() {
    nextCtx.fillStyle = '#221e2c';
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    var cells = SHAPES[game.next.type].states[0];
    var s = 18;
    var minC = Math.min.apply(null, cells.map(function(p){return p[1];}));
    var maxC = Math.max.apply(null, cells.map(function(p){return p[1];}));
    var minR = Math.min.apply(null, cells.map(function(p){return p[0];}));
    var maxR = Math.max.apply(null, cells.map(function(p){return p[0];}));
    var w = (maxC - minC + 1) * s, h = (maxR - minR + 1) * s;
    var ox = (nextCanvas.width - w) / 2, oy = (nextCanvas.height - h) / 2;
    var img = blockDataURL(SHAPES[game.next.type].skin);
    cells.forEach(function(p) {
      var x = ox + (p[1]-minC) * s, y = oy + (p[0]-minR) * s;
      if (img.complete && img.naturalWidth) nextCtx.drawImage(img, x, y, s, s);
      else { nextCtx.fillStyle = BLOCKS[SHAPES[game.next.type].skin].fill; nextCtx.fillRect(x, y, s, s); }
      nextCtx.strokeStyle = 'rgba(0,0,0,0.25)';
      nextCtx.strokeRect(x+0.5, y+0.5, s-1, s-1);
    });
  }

  function endGame() {
    game.over = true;
    if (game.score > best) {
      best = game.score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    finalScore.textContent = game.score;
    finalBest.textContent = best;
    statBest.textContent = best;
    gameOverlay.hidden = false;
  }

  function startGame() {
    game.board = emptyBoard();
    game.score = 0;
    game.lines = 0;
    game.level = 1;
    game.dropInterval = 700;
    game.over = false;
    game.keysDown.clear();
    statScore.textContent = 0;
    statLines.textContent = 0;
    statLevel.textContent = 1;
    gameOverlay.hidden = true;
    game.current = spawnPiece(randomType());
    game.next = spawnPiece(randomType());
    drawNext();
    game.lastDrop = performance.now();
    render();
  }

  function hardDrop() {
    if (game.over) return;
    game.current.row = ghostRow();
    lockPiece();
    render();
  }

  window.addEventListener('keydown', function(e) {
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(e.key) !== -1) e.preventDefault();
    if (game.over) return;
    if (e.key === 'ArrowLeft') { tryMove(0, -1); render(); }
    else if (e.key === 'ArrowRight') { tryMove(0, 1); render(); }
    else if (e.key === 'ArrowUp') { tryRotate(); render(); }
    else if (e.key === ' ') { hardDrop(); }
    else if (e.key === 'ArrowDown') { game.keysDown.add('down'); }
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowDown') game.keysDown.delete('down');
  });

  function bindPad(id, action, repeatable) {
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (repeatable) { game.keysDown.add(id); }
      else { action(); render(); }
    });
    el.addEventListener('pointerup', function() { game.keysDown.delete(id); });
    el.addEventListener('pointerleave', function() { game.keysDown.delete(id); });
  }
  bindPad('btnLeft', function() { tryMove(0, -1); }, true);
  bindPad('btnRight', function() { tryMove(0, 1); }, true);
  bindPad('btnDown', function() { tryMove(1, 0); }, true);
  bindPad('btnRotate', function() { tryRotate(); }, false);

  canvas.addEventListener('pointerdown', function(e) {
    if (game.over) return;
    var r = canvas.getBoundingClientRect();
    var xRatio = (e.clientX - r.left) / r.width;
    if (xRatio < 1/3) { tryMove(0, -1); }
    else if (xRatio > 2/3) { tryMove(0, 1); }
    else { tryRotate(); }
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  var REPEAT_MS = 110;
  function loop(now) {
    if (!game.over) {
      var repeatDue = now - game.lastRepeat > REPEAT_MS;
      if (repeatDue && (game.keysDown.has('btnLeft') || game.keysDown.has('btnRight') || game.keysDown.has('btnDown') || game.keysDown.has('down'))) {
        if (game.keysDown.has('btnLeft')) tryMove(0, -1);
        if (game.keysDown.has('btnRight')) tryMove(0, 1);
        if (game.keysDown.has('btnDown') || game.keysDown.has('down')) tryMove(1, 0);
        game.lastRepeat = now;
      }
      if (now - game.lastDrop > game.dropInterval) {
        if (!tryMove(1, 0)) lockPiece();
        game.lastDrop = now;
      }
      render();
    }
    requestAnimationFrame(loop);
  }

  startGame();
  requestAnimationFrame(loop);
})();
</script>
