<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curiosidades</title>
<style>
  :root{
    --sky:#8fd1ea;
    --sky-2:#bfe8f5;
    --sun:#f4c430;
    --ink:#2b2b1e;
    --panel:#ffffff;
    --border:#d8d0b8;
    --accent1:#ef476f;
    --accent2:#1c7ed6;
    --accent3:#2f9e44;
    --accent4:#9c36b5;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 400px at 50% -5%, var(--sky-2) 0%, var(--sky) 60%),
      var(--sky);
    background-attachment:fixed;
    color:var(--ink);
    font-family:Arial, Helvetica, sans-serif;
    text-transform:uppercase;
    min-height:100vh;
    padding-inline:16px;
    padding-block:28px;
    display:flex;
    justify-content:center;
  }

  .wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; gap:18px; }

  .top-row{ display:flex; justify-content:space-between; gap:8px; }
  .menu-link{
    font-family:Arial, sans-serif;
    font-size:13px;
    font-weight:bold;
    color:#2b2b1e;
    text-decoration:none;
    background:#fff;
    border:2px solid #3a3a3a;
    border-radius:6px;
    padding:7px 12px;
    box-shadow:0 3px 0 #b8b0a0;
  }
  .menu-link:hover{ color:var(--accent2); }

  header{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  h1{
    font-family:Arial, sans-serif;
    font-weight:900;
    font-size:clamp(28px, 7vw, 40px);
    margin:0;
    color:var(--accent1);
    text-shadow:3px 3px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
    letter-spacing:0.02em;
  }
  .subtitle{
    margin:0;
    font-size:16px;
    color:#3a3a2a;
    font-weight:bold;
  }

  .cards{ display:flex; flex-direction:column; gap:14px; }

  .card{
    background:var(--panel);
    border:3px solid var(--border);
    border-radius:16px;
    padding:0;
    box-shadow:0 10px 24px -12px rgba(0,0,0,0.35);
    display:flex;
    align-items:stretch;
    gap:0;
    overflow:hidden;
    text-align:left;
    cursor:pointer;
    width:100%;
    font:inherit;
    color:inherit;
  }
  .card:hover{ transform:translateY(-2px); }
  .card:focus-visible{ outline:3px solid var(--accent2); outline-offset:2px; }
  .card-thumb{
    width:110px;
    min-width:110px;
    height:110px;
    object-fit:cover;
    background:#eee;
  }
  .card-thumb-fallback{
    width:110px;
    min-width:110px;
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--sky-2);
  }
  .card-thumb-fallback svg{ width:60px; height:60px; }
  .card-body-row{
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    justify-content:center;
    min-width:0;
  }
  .card-title{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:900;
    font-size:19px;
    color:var(--accent2);
  }
  .card:nth-child(4n+2) .card-title{ color:var(--accent1); }
  .card:nth-child(4n+3) .card-title{ color:var(--accent3); }
  .card:nth-child(4n+4) .card-title{ color:var(--accent4); }
  .card-teaser{
    margin:0;
    font-family:Arial, sans-serif;
    font-size:13px;
    color:#5a5a4a;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .card-cta{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:bold;
    font-size:12px;
    color:var(--accent3);
  }

  .del-link{
    font-family:Arial, sans-serif;
    font-size:11px;
    color:var(--accent1);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    align-self:flex-start;
  }

  .detail{ display:flex; flex-direction:column; gap:16px; }
  .back-btn{
    align-self:flex-start;
    font-family:Arial, sans-serif;
    font-size:13px;
    font-weight:bold;
    color:#2b2b1e;
    background:#fff;
    border:2px solid #3a3a3a;
    border-radius:6px;
    padding:7px 12px;
    box-shadow:0 3px 0 #b8b0a0;
    cursor:pointer;
  }
  .detail-hero{
    background:var(--panel);
    border:3px solid var(--border);
    border-radius:16px;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  .detail-hero svg{ width:130px; height:130px; }
  .detail-title{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:900;
    font-size:clamp(24px, 6vw, 32px);
    color:var(--accent1);
  }
  .detail-intro{
    margin:0;
    font-family:Arial, sans-serif;
    font-size:14px;
    text-transform:uppercase;
    line-height:1.7;
    color:#2b2b1e;
    max-width:56ch;
  }
  .detail-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
    gap:8px;
  }
  .detail-gallery img{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid var(--border);
    background:#eee;
    cursor:zoom-in;
  }
  .section-card{
    background:var(--panel);
    border:3px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .section-icon{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    font-weight:900;
    font-size:16px;
    color:#fff;
  }
  .section-card:nth-child(4n+1) .section-icon{ background:var(--accent1); }
  .section-card:nth-child(4n+2) .section-icon{ background:var(--accent2); }
  .section-card:nth-child(4n+3) .section-icon{ background:var(--accent3); }
  .section-card:nth-child(4n) .section-icon{ background:var(--accent4); }
  .section-text{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .section-heading{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:900;
    font-size:15px;
    color:#3a3a2a;
    text-transform:uppercase;
  }
  .section-body{
    margin:0;
    font-family:Arial, sans-serif;
    font-size:14px;
    text-transform:uppercase;
    line-height:1.7;
    color:#2b2b1e;
  }

  .empty-msg{
    text-align:center;
    font-size:15px;
    color:#3a3a2a;
    background:rgba(255,255,255,0.6);
    border-radius:12px;
    padding:24px;
  }

  .admin-box{
    background:var(--panel);
    border:3px dashed #b8b0a0;
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .admin-title{
    margin:0;
    font-family:Arial, sans-serif;
    font-weight:bold;
    font-size:15px;
    color:#3a3a2a;
  }
  .admin-form{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .admin-form input{
    flex:1;
    min-width:110px;
    font-family:Arial, sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:2px solid #b8b0a0;
    border-radius:6px;
  }
  .admin-btn{
    font-family:Arial, sans-serif;
    font-weight:bold;
    font-size:13px;
    color:#fff;
    background:var(--accent3);
    border:none;
    border-radius:6px;
    padding:9px 16px;
    cursor:pointer;
  }
  .admin-btn:disabled{ opacity:0.6; cursor:default; }
  .admin-status{ margin:0; font-size:13px; }
  .admin-status.err{ color:var(--accent1); }
  .admin-status.ok{ color:var(--accent3); }

  [hidden]{ display:none !important; }
</style>
</head>
<body>


<div class="wrap">
  <div class="top-row">
    <a class="menu-link" href="../">← MENU</a>
  </div>
  <header>
    <h1>Curiosidades</h1>
    <p class="subtitle">Coisas curiosas do mundo, explicadas de um jeito divertido!</p>
  </header>

  <div id="listView">
    <div class="cards" id="cardsEl"></div>
    <p class="empty-msg" id="emptyMsg" hidden>Nenhuma curiosidade ainda. Volte logo!</p>
  </div>

  <div class="detail" id="detailView" hidden>
    <button class="back-btn" id="backBtn" type="button">← Todas as curiosidades</button>
    <div class="detail-hero">
      <div id="detailIcon"></div>
      <h2 class="detail-title" id="detailTitle"></h2>
      <p class="detail-intro" id="detailIntro"></p>
    </div>
    <div class="detail-gallery" id="detailGallery"></div>
    <div id="detailSections"></div>
    <p class="wiki-link" id="detailWikiLink">Fonte: Wikipédia</p>
  </div>

  <div class="admin-box" id="adminBox" hidden>
    <p class="admin-title">Adicionar novo tema (vira curiosidade automaticamente)</p>
    <div class="admin-form">
      <input type="text" id="topicInput" placeholder="ex: Buraco Negro">
      <input type="text" id="adminUser" placeholder="usuário" autocomplete="username">
      <input type="password" id="adminPass" placeholder="senha" autocomplete="current-password">
      <button class="admin-btn" id="addBtn" type="button">Adicionar</button>
    </div>
    <p class="admin-status" id="adminStatus" hidden></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var API_BASE = 'https://labirinto-das-sombras.mosquito38.workers.dev';

  var cardsEl = document.getElementById('cardsEl');
  var emptyMsg = document.getElementById('emptyMsg');
  var listView = document.getElementById('listView');
  var detailView = document.getElementById('detailView');
  var detailIcon = document.getElementById('detailIcon');
  var detailTitle = document.getElementById('detailTitle');
  var detailIntro = document.getElementById('detailIntro');
  var detailGallery = document.getElementById('detailGallery');
  var detailSectionsEl = document.getElementById('detailSections');
  var detailWikiLink = document.getElementById('detailWikiLink');
  var backBtn = document.getElementById('backBtn');
  var adminBox = document.getElementById('adminBox');
  var topicInput = document.getElementById('topicInput');
  var adminUser = document.getElementById('adminUser');
  var adminPass = document.getElementById('adminPass');
  var addBtn = document.getElementById('addBtn');
  var adminStatus = document.getElementById('adminStatus');

  var isMobile = /Android|iPhone|iPod|Windows Phone/i.test(navigator.userAgent) ||
    (window.matchMedia('(pointer: coarse)').matches && window.matchMedia('(max-width: 640px)').matches);
  if (!isMobile) adminBox.hidden = false;

  var ICONS = {
    'polo sul': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="88" rx="46" ry="8" fill="#bfe8f5"/><ellipse cx="50" cy="70" rx="30" ry="9" fill="#eaf6ff"/><ellipse cx="50" cy="62" rx="18" ry="26" fill="#2b2b3a"/><ellipse cx="50" cy="66" rx="11" ry="20" fill="#f4f4f4"/><circle cx="50" cy="34" r="15" fill="#2b2b3a"/><circle cx="45" cy="33" r="2.2" fill="#fff"/><circle cx="55" cy="33" r="2.2" fill="#fff"/><polygon points="44,40 56,40 50,48" fill="#f2994a"/><rect x="76" y="20" width="3" height="24" fill="#8b5a2b"/><polygon points="79,20 95,26 79,32" fill="#ef476f"/></svg>',
    'polo norte': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="88" rx="46" ry="8" fill="#bfe8f5"/><ellipse cx="50" cy="72" rx="34" ry="10" fill="#eaf6ff"/><ellipse cx="35" cy="55" rx="16" ry="13" fill="#f4f4f4"/><circle cx="58" cy="45" r="20" fill="#f4f4f4"/><circle cx="50" cy="38" r="4" fill="#f4f4f4"/><circle cx="68" cy="38" r="4" fill="#f4f4f4"/><circle cx="52" cy="43" r="2" fill="#2b2b1e"/><circle cx="64" cy="43" r="2" fill="#2b2b1e"/><ellipse cx="58" cy="50" rx="5" ry="3.5" fill="#e8dcc4"/><circle cx="58" cy="49" r="1.6" fill="#2b2b1e"/><g fill="#bfe8f5"><circle cx="18" cy="20" r="3"/><circle cx="30" cy="14" r="2.2"/><circle cx="10" cy="34" r="2.2"/></g></svg>',
    'ponto nemo': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0d2f5c" opacity="0"/><g fill="#fff3c4"><circle cx="16" cy="16" r="1.6"/><circle cx="34" cy="10" r="1.2"/><circle cx="70" cy="14" r="1.6"/><circle cx="86" cy="24" r="1.2"/><circle cx="50" cy="8" r="1.2"/></g><path d="M10 62 Q 25 54 40 62 T 70 62 T 100 62 V 90 H 0 V 62 Z" fill="#1c7ed6"/><path d="M10 70 Q 25 62 40 70 T 70 70 T 100 70 V 90 H 0 V 70 Z" fill="#3a78c2" opacity="0.8"/><path d="M42 58 L46 40 L52 40 L56 58 Z" fill="#8b5a2b"/><path d="M40 58 L58 58 L62 66 L36 66 Z" fill="#eaf6ff" stroke="#3a3a3a" stroke-width="1"/><polygon points="48,42 48,54 58,50" fill="#fff"/></svg>',
    'buraco negro': '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="#fff3c4"><circle cx="14" cy="20" r="1.6"/><circle cx="86" cy="16" r="1.2"/><circle cx="90" cy="70" r="1.6"/><circle cx="10" cy="76" r="1.2"/><circle cx="50" cy="10" r="1.2"/><circle cx="20" cy="90" r="1.2"/></g><circle cx="50" cy="50" r="38" fill="none" stroke="#9c6ad4" stroke-width="3" opacity="0.5"/><circle cx="50" cy="50" r="28" fill="none" stroke="#4ad9d9" stroke-width="3" opacity="0.6"/><path d="M50 50 m-38 0 a38 38 0 0 1 66 -22" fill="none" stroke="#f2994a" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="16" fill="#0d0a18"/></svg>'
  };
  var DEFAULT_ICON = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="46" cy="44" r="22" fill="#f4c430" stroke="#c99a1e" stroke-width="3"/><circle cx="40" cy="40" r="3" fill="#2b2b1e"/><circle cx="52" cy="40" r="3" fill="#2b2b1e"/><path d="M38 50 Q46 56 54 50" stroke="#2b2b1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="60" y="58" width="8" height="26" rx="3" fill="#9c9c9c" transform="rotate(35 64 58)"/><circle cx="60" cy="58" r="16" fill="none" stroke="#9c9c9c" stroke-width="5"/><g fill="#ef476f"><circle cx="82" cy="16" r="2"/><circle cx="14" cy="70" r="2.4"/><circle cx="18" cy="16" r="1.6"/></g></svg>';

  function iconFor(topic) {
    return ICONS[(topic || '').trim().toLowerCase()] || DEFAULT_ICON;
  }

  var currentTopics = [];

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showList() {
    detailView.hidden = true;
    listView.hidden = false;
    if (location.hash) history.replaceState(null, '', location.pathname);
  }

  function showDetail(t) {
    listView.hidden = true;
    detailView.hidden = false;
    detailIcon.innerHTML = iconFor(t.topic);
    detailTitle.textContent = t.topic;
    detailIntro.textContent = t.funText;
    detailGallery.innerHTML = '';
    (t.images || []).forEach(function(src) {
      var img = document.createElement('img');
      img.src = src;
      img.alt = t.topic;
      img.loading = 'lazy';
      detailGallery.appendChild(img);
    });
    detailSectionsEl.innerHTML = '';
    (t.detailSections || []).forEach(function(sec, i) {
      var card = document.createElement('div');
      card.className = 'section-card';
      var icon = document.createElement('div');
      icon.className = 'section-icon';
      icon.textContent = (i + 1);
      var textWrap = document.createElement('div');
      textWrap.className = 'section-text';
      if (sec.heading) {
        var h3 = document.createElement('h3');
        h3.className = 'section-heading';
        h3.textContent = sec.heading;
        textWrap.appendChild(h3);
      }
      var body = document.createElement('p');
      body.className = 'section-body';
      body.textContent = sec.body;
      textWrap.appendChild(body);
      card.appendChild(icon);
      card.appendChild(textWrap);
      detailSectionsEl.appendChild(card);
    });
    detailWikiLink.hidden = !t.wikiUrl;
    window.scrollTo(0, 0);
    history.replaceState(null, '', location.pathname + '#' + t.id);
  }

  backBtn.addEventListener('click', showList);

  function openFromHash() {
    var id = location.hash.replace('#', '');
    if (!id) return;
    var t = currentTopics.filter(function(x) { return x.id === id; })[0];
    if (t) showDetail(t);
  }
  window.addEventListener('hashchange', openFromHash);

  function render(topics) {
    currentTopics = topics;
    cardsEl.innerHTML = '';
    emptyMsg.hidden = topics.length > 0;
    topics.slice().reverse().forEach(function(t) {
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      var open = function() { showDetail(t); };
      card.addEventListener('click', function(e) {
        if (e.target.closest('.del-link')) return;
        open();
      });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });

      if (t.images && t.images[0]) {
        var thumb = document.createElement('img');
        thumb.className = 'card-thumb';
        thumb.src = t.images[0];
        thumb.alt = t.topic;
        thumb.loading = 'lazy';
        card.appendChild(thumb);
      } else {
        var fb = document.createElement('div');
        fb.className = 'card-thumb-fallback';
        fb.innerHTML = iconFor(t.topic);
        card.appendChild(fb);
      }

      var bodyRow = document.createElement('div');
      bodyRow.className = 'card-body-row';

      var h2 = document.createElement('h2');
      h2.className = 'card-title';
      h2.textContent = t.topic;
      bodyRow.appendChild(h2);

      var teaser = document.createElement('p');
      teaser.className = 'card-teaser';
      teaser.textContent = t.funText;
      bodyRow.appendChild(teaser);

      var cta = document.createElement('p');
      cta.className = 'card-cta';
      cta.textContent = 'Saiba mais →';
      bodyRow.appendChild(cta);

      if (!isMobile) {
        var del = document.createElement('button');
        del.className = 'del-link';
        del.type = 'button';
        del.textContent = 'apagar este tema';
        del.addEventListener('click', function(e) {
          e.stopPropagation();
          deleteTopic(t.id);
        });
        bodyRow.appendChild(del);
      }

      card.appendChild(bodyRow);
      cardsEl.appendChild(card);
    });
  }

  function loadTopics() {
    fetch(API_BASE + '/api/curiosities').then(function(res) { return res.json(); }).then(function(data) {
      render(data.topics || []);
    }).catch(function() {
      emptyMsg.hidden = false;
      emptyMsg.textContent = 'Não consegui carregar as curiosidades agora.';
    });
  }

  function deleteTopic(id) {
    var user = window.prompt('Usuário pra apagar:');
    if (!user) return;
    var pass = window.prompt('Senha:');
    if (!pass) return;
    fetch(API_BASE + '/api/curiosities/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Basic ' + btoa(user + ':' + pass) }
    }).then(function(res) {
      if (res.ok) loadTopics();
      else window.alert('Não consegui apagar (usuário/senha errados?).');
    }).catch(function() { window.alert('Falha de conexão.'); });
  }

  addBtn.addEventListener('click', function() {
    var topic = topicInput.value.trim();
    var user = adminUser.value.trim(), pass = adminPass.value;
    if (!topic) {
      adminStatus.className = 'admin-status err';
      adminStatus.textContent = 'Escreva um tema.';
      adminStatus.hidden = false;
      return;
    }
    if (!user || !pass) {
      adminStatus.className = 'admin-status err';
      adminStatus.textContent = 'Preencha usuário e senha.';
      adminStatus.hidden = false;
      return;
    }
    addBtn.disabled = true;
    adminStatus.className = 'admin-status';
    adminStatus.textContent = 'Buscando na Wikipédia e transformando pra criançada... (pode levar uns segundos)';
    adminStatus.hidden = false;
    fetch(API_BASE + '/api/curiosities', {
      method: 'POST',
      headers: {
        'Authorization': 'Basic ' + btoa(user + ':' + pass),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ topic: topic })
    }).then(function(res) {
      return res.json().then(function(data) { return { ok: res.ok, data: data }; });
    }).then(function(r) {
      addBtn.disabled = false;
      if (r.ok) {
        adminStatus.className = 'admin-status ok';
        adminStatus.textContent = 'Adicionado! "' + r.data.topic + '" já está na lista.';
        topicInput.value = '';
        adminPass.value = '';
        loadTopics();
      } else {
        adminStatus.className = 'admin-status err';
        adminStatus.textContent = r.data.error || 'Não consegui adicionar.';
      }
    }).catch(function() {
      addBtn.disabled = false;
      adminStatus.className = 'admin-status err';
      adminStatus.textContent = 'Falha de conexão. Tente de novo.';
    });
  });

  loadTopics();
})();
</script>

</body>
</html>
